# ClinicSoft EMR (v2 REST API) -> FHIR R4.
#
# Everything the gateway knows about ClinicSoft is in this file: how to call
# it, how its search parameters line up with FHIR's, and how each record maps
# to a FHIR resource. A walkthrough is in docs/adapter-guide.md.
#
# Expressions in `map`, `results`, `total` and inside {braces} are JSONata
# (https://docs.jsonata.org). Helpers: $localToUtc, $addMinutes, $lookup,
# $reference, $date, $localDate, $lastLocalDate, and $config.

vendor: clinicsoft
name: ClinicSoft
timezone: America/Toronto        # ClinicSoft stores local dates/times without offsets

auth:
  type: apiKey
  header: X-API-Key              # the key itself comes from the clinic connection (env var)

paging:
  pageParam: page
  sizeParam: pageSize
  maxPageSize: 100

# Per-clinic values; a clinic's ehr_connections.adapter_config.config overrides them.
config:
  chartNoSystem: https://clinicsoft.example/fhir/sid/chart-no
  providerLicenceSystem: https://clinicsoft.example/fhir/sid/cpso
  orgLicenceSystem: https://clinicsoft.example/fhir/sid/org-licence
  # Ontario health card number (Canada Health Infoway NamingSystem ca-on-patient-hcn).
  hcnSystem: https://fhir.infoway-inforoute.ca/NamingSystem/ca-on-patient-hcn

codes:
  sex: { M: male, F: female, U: unknown }
  appointmentStatus: { B: booked, C: cancelled, N: noshow, A: arrived }
  visitMode: { VIRT_VIDEO: video, VIRT_PHONE: telephone }
  visitModeDisplay: { VIRT_VIDEO: Video consultation, VIRT_PHONE: Telephone consultation }
  encounterStatus: { OPEN: in-progress, CLOSED: finished, VOID: cancelled }
  encounterClass:                # ClinicSoft class -> HL7 v3 ActCode
    ambulatory: AMB
    wellness: AMB
    outpatient: AMB
    urgentcare: AMB
    emergency: EMER
    inpatient: IMP
    snf: IMP
    home: HH
    hospice: HH
    virtual: VR
  problemStatus: { A: active, R: resolved }                # -> condition-clinical
  allergyStatus: { A: active, I: inactive }                # -> allergyintolerance-clinical
  allergyType: { ALLERGY: allergy, INTOLERANCE: intolerance }
  allergyCategory: { FOOD: food, DRUG: medication, ENV: environment, BIO: biologic }
  severity: { MILD: mild, MOD: moderate, SEV: severe }
  rxStatus: { A: active, C: completed }
  resultCategory: { VS: vital-signs, LAB: laboratory }      # -> observation-category
  resultCategoryDisplay: { VS: Vital signs, LAB: Laboratory }
  resultValueType: { N: quantity, T: text, BP: blood-pressure }

resources:
  Patient:
    read: { path: "/patients/{id}", result: patient }
    search:
      path: /patients
      results: patients
      total: totalCount
      params:
        _id: { type: id }
        family: { type: string, multiple: true }     # ClinicSoft: case/accent-insensitive "starts with", comma = any of
        given: { type: string }
        birthdate: { type: date, prefixes: [eq, ge, gt, le, lt], precision: day }
        identifier: { type: token, system: "{$config.chartNoSystem}" }
      query:
        lastName: "{$join(family.values, ',')}"
        firstName: "{given.value}"
        dobFrom: "{$localDate(birthdate.start, 'DD/MM/YYYY')}"
        dobTo: "{$lastLocalDate(birthdate.end, 'DD/MM/YYYY')}"
        chartNo: "{identifier.value}"
    map: |
      {
        "resourceType": "Patient",
        "id": patientNo,
        "identifier": [chartNo ? {
          "type": {
            "coding": [{ "system": "http://terminology.hl7.org/CodeSystem/v2-0203", "code": "MR", "display": "Medical Record Number" }],
            "text": "Medical Record Number"
          },
          "system": $config.chartNoSystem,
          "value": chartNo
        }, healthCardNo ? {
          "extension": [healthCardVersion ? {
            "url": "http://hl7.org/fhir/ca/baseline/StructureDefinition/ext-identifierversion",
            "valueString": healthCardVersion
          }],
          "use": "official",
          "type": {
            "coding": [{ "system": "http://terminology.hl7.org/CodeSystem/v2-0203", "code": "JHN", "display": "Jurisdictional health number (Canada)" }],
            "text": "Ontario health card number"
          },
          "system": $config.hcnSystem,
          "value": healthCardNo
        }],
        "name": [{
          "use": "official",
          "family": lastName,
          "given": [firstName, middleName],
          "prefix": [title],
          "suffix": [suffix]
        }],
        "telecom": [
          cellPhone ? { "system": "phone", "value": cellPhone, "use": "mobile" },
          homePhone ? { "system": "phone", "value": homePhone, "use": "home" },
          email ? { "system": "email", "value": email }
        ],
        "gender": $lookup('sex', sex),
        "birthDate": $date(dob, 'DD/MM/YYYY'),
        "deceasedDateTime": $date(deceasedDate, 'DD/MM/YYYY'),
        "address": [{ "line": [address1], "city": city, "state": province, "postalCode": postalCode }]
      }

  Practitioner:
    read: { path: "/providers/{id}", result: provider }
    search:
      path: /providers
      results: providers
      total: totalCount
      params:
        _id: { type: id }
        family: { type: string }
        identifier: { type: token, system: "{$config.providerLicenceSystem}" }
      query:
        lastName: "{family.value}"
        cpsoNo: "{identifier.value}"
    map: |
      {
        "resourceType": "Practitioner",
        "id": providerNo,
        "identifier": [cpsoNo ? { "system": $config.providerLicenceSystem, "value": cpsoNo }],
        "name": [{ "family": lastName, "given": [firstName], "prefix": [title] }],
        "gender": $lookup('sex', sex)
      }

  Organization:
    read: { path: "/organizations/{id}", result: organization }
    map: |
      {
        "resourceType": "Organization",
        "id": orgId,
        "identifier": [licenceNo ? { "system": $config.orgLicenceSystem, "value": licenceNo }],
        "name": orgName,
        "telecom": [phone ? { "system": "phone", "value": phone, "use": "work" }],
        "address": [{ "line": [address1], "city": city, "state": province, "postalCode": postalCode }]
      }

  Appointment:
    read: { path: "/schedule/{id}", result: appointment }
    search:
      path: /schedule
      results: appointments
      total: totalCount
      params:
        _id: { type: id }
        patient: { type: reference, target: Patient }
        practitioner: { type: reference, target: Practitioner }
        actor:                                        # lands in the same slots, so actor + practitioner must agree
          type: reference
          target: [Patient, Practitioner]
          as: { Patient: patient, Practitioner: practitioner }
        date: { type: date, prefixes: [eq, ge, gt, le, lt], precision: day }   # ClinicSoft filters by local day
        status: { type: token, codes: appointmentStatus, multiple: true }
      query:
        patientNo: "{patient.id}"
        providerNo: "{practitioner.id}"
        from: "{$localDate(date.start)}"
        to: "{$lastLocalDate(date.end)}"
        status: "{$join(status.values, ',')}"
    map: |
      (
        $start := $localToUtc(apptDate, startTime);
        {
          "resourceType": "Appointment",
          "id": apptId,
          "status": $lookup('appointmentStatus', status),
          "serviceType": [{
            "coding": [{
              "system": "https://brevicor.ca/fhir/CodeSystem/consultation-modality",
              "code": $lookup('visitMode', type),
              "display": $lookup('visitModeDisplay', type)
            }],
            "text": $lookup('visitModeDisplay', type)
          }],
          "reasonCode": [reason ? { "text": reason }],
          "start": $start,
          "end": $addMinutes($start, duration),
          "minutesDuration": duration,
          "participant": [
            patientNo ? { "actor": $reference('Patient', patientNo), "status": "accepted" },
            providerNo ? { "actor": $reference('Practitioner', providerNo), "status": "accepted" }
          ]
        }
      )

  Encounter:
    read: { path: "/encounters/{id}", result: encounter }
    search:
      path: /encounters
      results: encounters
      total: totalCount
      params:
        _id: { type: id }
        patient: { type: reference, target: Patient }
        subject: { type: reference, target: Patient, as: { Patient: patient } }
        appointment: { type: reference, target: Appointment }
        # ClinicSoft can only filter by the day an encounter *starts* (FHIR's
        # Encounter date covers the whole period); see docs/adapter-guide.md.
        date: { type: date, prefixes: [eq, ge, gt, le, lt], precision: day }
      query:
        patientNo: "{patient.id}"
        apptId: "{appointment.id}"
        from: "{$localDate(date.start)}"
        to: "{$lastLocalDate(date.end)}"
    map: |
      {
        "resourceType": "Encounter",
        "id": encounterNo,
        "status": $lookup('encounterStatus', encStatus),
        "class": { "system": "http://terminology.hl7.org/CodeSystem/v3-ActCode", "code": $lookup('encounterClass', encClass) },
        "type": [encTypeCode ? {
          "coding": [{ "system": "http://snomed.info/sct", "code": encTypeCode, "display": encTypeDesc }],
          "text": encTypeDesc
        }],
        "subject": $reference('Patient', patientNo),
        "participant": [providerNo ? { "individual": $reference('Practitioner', providerNo) }],
        "appointment": [$reference('Appointment', apptId)],
        "period": { "start": $localToUtc(startDateTime), "end": $localToUtc(endDateTime) },
        "serviceProvider": $reference('Organization', orgId)
      }

  DocumentReference:
    read: { path: "/documents/{id}", result: document }
    search:
      path: /documents
      results: documents
      total: totalCount
      params:
        _id: { type: id }
        patient: { type: reference, target: Patient }
        subject: { type: reference, target: Patient, as: { Patient: patient } }
        encounter: { type: reference, target: Encounter }
      query:
        patientNo: "{patient.id}"
        encounterNo: "{encounter.id}"
    map: |
      {
        "resourceType": "DocumentReference",
        "id": docId,
        "status": "current",
        "type": docType ? { "text": docType },
        "subject": $reference('Patient', patientNo),
        "date": $localToUtc(createdAt),
        "content": [{ "attachment": { "contentType": mimeType, "data": body } }],
        "context": encounterNo ? { "encounter": [$reference('Encounter', encounterNo)] }
      }

  # --- Clinical history (read/search) -----------------------------------------
  # ClinicSoft keeps no versions, verification status or category for these;
  # the maps add only what FHIR requires and the vendor implies:
  # Observation.status = final (ClinicSoft holds only signed-off results) and
  # MedicationRequest.intent = order (a ClinicSoft prescription is an order).

  Condition:
    read: { path: "/problems/{id}", result: problem }
    search:
      path: /problems
      results: problems
      total: totalCount
      params:
        _id: { type: id }
        patient: { type: reference, target: Patient }
        subject: { type: reference, target: Patient, as: { Patient: patient } }
        clinical-status:
          type: token
          codes: problemStatus
          multiple: true
          system: http://terminology.hl7.org/CodeSystem/condition-clinical
      query:
        patientNo: "{patient.id}"
        status: "{$join(`clinical-status`.values, ',')}"
    map: |
      {
        "resourceType": "Condition",
        "id": problemId,
        "clinicalStatus": { "coding": [{
          "system": "http://terminology.hl7.org/CodeSystem/condition-clinical",
          "code": $lookup('problemStatus', status)
        }] },
        "code": {
          "coding": [{ "system": "http://snomed.info/sct", "code": snomedCode, "display": description }],
          "text": description
        },
        "subject": $reference('Patient', patientNo),
        "encounter": $reference('Encounter', encounterNo),
        "onsetDateTime": onsetDate,
        "abatementDateTime": resolvedDate,
        "recordedDate": onsetDate
      }

  AllergyIntolerance:
    read: { path: "/allergies/{id}", result: allergy }
    search:
      path: /allergies
      results: allergies
      total: totalCount
      params:
        _id: { type: id }
        patient: { type: reference, target: Patient }   # R4 has no `subject` param here
      query:
        patientNo: "{patient.id}"
    map: |
      (
        $reaction := function($code, $text, $severity) {
          ($code or $text) ? {
            "manifestation": [{
              "coding": [$code ? { "system": "http://snomed.info/sct", "code": $code, "display": $text }],
              "text": $text
            }],
            "severity": $lookup('severity', $severity)
          }
        };
        {
          "resourceType": "AllergyIntolerance",
          "id": allergyId,
          "clinicalStatus": { "coding": [{
            "system": "http://terminology.hl7.org/CodeSystem/allergyintolerance-clinical",
            "code": $lookup('allergyStatus', status)
          }] },
          "type": $lookup('allergyType', allergyType),
          "category": [$lookup('allergyCategory', category)],
          "code": {
            "coding": [{ "system": "http://snomed.info/sct", "code": allergenCode, "display": allergen }],
            "text": allergen
          },
          "patient": $reference('Patient', patientNo),
          "encounter": $reference('Encounter', encounterNo),
          "recordedDate": onsetDate,
          "reaction": [
            $reaction(reaction1Code, reaction1, severity1),
            $reaction(reaction2Code, reaction2, severity2)
          ]
        }
      )

  MedicationRequest:
    read: { path: "/prescriptions/{id}", result: prescription }
    search:
      path: /prescriptions
      results: prescriptions
      total: totalCount
      params:
        _id: { type: id }
        patient: { type: reference, target: Patient }
        subject: { type: reference, target: Patient, as: { Patient: patient } }
        status: { type: token, codes: rxStatus, multiple: true }
      query:
        patientNo: "{patient.id}"
        status: "{$join(status.values, ',')}"
    map: |
      {
        "resourceType": "MedicationRequest",
        "id": rxId,
        "status": $lookup('rxStatus', status),
        "intent": "order",
        "medicationCodeableConcept": {
          "coding": [{ "system": "http://www.nlm.nih.gov/research/umls/rxnorm", "code": rxnormCode, "display": drugName }],
          "text": drugName
        },
        "subject": $reference('Patient', patientNo),
        "encounter": $reference('Encounter', encounterNo),
        "authoredOn": $localToUtc(startDateTime),
        "reasonCode": [reasonCode ? {
          "coding": [{ "system": "http://snomed.info/sct", "code": reasonCode, "display": reasonDesc }],
          "text": reasonDesc
        }],
        "dosageInstruction": [sig ? { "text": sig }]
      }

  Observation:
    read: { path: "/results/{id}", result: result }
    search:
      path: /results
      results: results
      total: totalCount
      params:
        _id: { type: id }
        patient: { type: reference, target: Patient }
        subject: { type: reference, target: Patient, as: { Patient: patient } }
        category:
          type: token
          codes: resultCategory
          multiple: true
          system: http://terminology.hl7.org/CodeSystem/observation-category
        code: { type: token, multiple: true, system: http://loinc.org }   # ClinicSoft test codes are LOINC
        date: { type: date, prefixes: [eq, ge, gt, le, lt], precision: day }   # ClinicSoft filters by local day
      query:
        patientNo: "{patient.id}"
        category: "{$join(category.values, ',')}"
        testCode: "{$join(code.values, ',')}"
        from: "{$localDate(date.start)}"
        to: "{$lastLocalDate(date.end)}"
    map: |
      (
        $kind := $lookup('resultValueType', valueType);
        $unit := units;
        $quantity := function($v) {
          { "value": $number($v), "unit": $unit, "system": "http://unitsofmeasure.org", "code": $unit }
        };
        $bp := $kind = 'blood-pressure' ? $split(value, '/');
        {
          "resourceType": "Observation",
          "id": resultId,
          "status": "final",
          "category": [{ "coding": [{
            "system": "http://terminology.hl7.org/CodeSystem/observation-category",
            "code": $lookup('resultCategory', category),
            "display": $lookup('resultCategoryDisplay', category)
          }] }],
          "code": {
            "coding": [{ "system": "http://loinc.org", "code": testCode, "display": testName }],
            "text": testName
          },
          "subject": $reference('Patient', patientNo),
          "encounter": $reference('Encounter', encounterNo),
          "effectiveDateTime": $localToUtc(resultDateTime),
          "valueQuantity": $kind = 'quantity' and value ? $quantity(value),
          "valueCodeableConcept": $kind = 'text' and value ? { "text": value },
          "component": $kind = 'blood-pressure' ? [
            {
              "code": {
                "coding": [{ "system": "http://loinc.org", "code": "8462-4", "display": "Diastolic Blood Pressure" }],
                "text": "Diastolic Blood Pressure"
              },
              "valueQuantity": $quantity($bp[1])
            },
            {
              "code": {
                "coding": [{ "system": "http://loinc.org", "code": "8480-6", "display": "Systolic Blood Pressure" }],
                "text": "Systolic Blood Pressure"
              },
              "valueQuantity": $quantity($bp[0])
            }
          ]
        }
      )
